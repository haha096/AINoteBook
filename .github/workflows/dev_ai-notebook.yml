name: Build and deploy JAR app to Azure Web App - AI-NoteBook

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 실행 권한을 부여합니다. (중요!)
      - name: chmod gradlew
        run: chmod +x ./gradlew

      # Gradle로 빌드를 진행합니다. (테스트는 생략해서 속도를 높입니다.)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/build/libs/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AI-NoteBook'
          slot-name: 'Production'
          package: '*.jar'
          # Azure에서 생성해준 publish-profile 정보는 그대로 유지됩니다.
          # 아래 줄을 새로 추가합니다! (방금 등록한 Secret 이름)
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          
